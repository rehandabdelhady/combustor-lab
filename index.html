<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Combustor Digital Twin</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:#020617;
  font-family:Arial,sans-serif;
  color:white;
}

#ui{
  position:absolute;
  top:18px;
  left:18px;
  z-index:10;
  width:330px;
  background:rgba(2,6,23,.86);
  border:1px solid #38bdf8;
  border-radius:18px;
  padding:18px;
  box-shadow:0 0 35px rgba(56,189,248,.35);
}

h1{
  margin:0 0 8px;
  font-size:21px;
  color:#e0f2fe;
}

#status{
  color:#22c55e;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:14px;
}

button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #38bdf8;
  background:#082f49;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0369a1;
}

.reading{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid rgba(148,163,184,.25);
}

.reading span{color:#94a3b8;}
.reading b{color:#67e8f9;}

#hint{
  position:absolute;
  right:20px;
  bottom:20px;
  color:#94a3b8;
  font-size:13px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="ui">
  <h1>3D Lab-Scale Gas Turbine</h1>
  <div id="status">SYSTEM STANDBY</div>

  <button onclick="nextStep()">START NEXT SYSTEM</button>
  <button onclick="autoRun()">AUTO IGNITION</button>
  <button onclick="shutdown()">SHUTDOWN</button>

  <div class="reading"><span>Temperature</span><b id="temp">300 K</b></div>
  <div class="reading"><span>Pressure</span><b id="pressure">0.0 bar</b></div>
  <div class="reading"><span>Air Flow</span><b id="flow">0.00 kg/s</b></div>
  <div class="reading"><span>Efficiency</span><b id="eff">--</b></div>
</div>

<div id="hint">Drag mouse to rotate · Scroll to zoom</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let step = 0;
let autoTimer = null;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020617);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(7, 4, 8);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, .9, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x0f172a, 1.4));

const light = new THREE.DirectionalLight(0xffffff, 2.2);
light.position.set(5, 8, 5);
light.castShadow = true;
scene.add(light);

const blueLight = new THREE.PointLight(0x38bdf8, 2.5, 12);
blueLight.position.set(-3, 3, 2);
scene.add(blueLight);

const flameLight = new THREE.PointLight(0xff7a00, 0, 8);
flameLight.position.set(.7, 1.2, 0);
scene.add(flameLight);

const metal = new THREE.MeshStandardMaterial({color:0xb6c2cf,metalness:.75,roughness:.22});
const dark = new THREE.MeshStandardMaterial({color:0x111827,metalness:.8,roughness:.35});
const blue = new THREE.MeshStandardMaterial({color:0x0284c7,metalness:.55,roughness:.25});
const red = new THREE.MeshStandardMaterial({color:0xdc2626,metalness:.35,roughness:.35});
const yellow = new THREE.MeshStandardMaterial({color:0xfacc15,metalness:.35,roughness:.35});

const glass = new THREE.MeshPhysicalMaterial({
  color:0xdbeafe,
  transparent:true,
  opacity:.3,
  roughness:.04,
  metalness:0,
  transmission:.4,
  clearcoat:1
});

const heaterMat = new THREE.MeshBasicMaterial({color:0xff7a00,transparent:true,opacity:0});
const flameMat = new THREE.MeshBasicMaterial({color:0xff7a00,transparent:true,opacity:0});

function cyl(r,d,mat,x,y,z){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r,r,d,64), mat);
  mesh.rotation.z = Math.PI / 2;
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function box(w,h,d,mat,x,y,z){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cone(r1,r2,h,mat,x,y,z){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,64), mat);
  mesh.rotation.z = Math.PI / 2;
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}

function sphere(r,mat,x,y,z){
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r,32,24), mat);
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}

/* floor */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(18,10),
  new THREE.MeshStandardMaterial({color:0x07111f,roughness:.8})
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(18,36,0x38bdf8,0x1e293b);
scene.add(grid);

/* base frame */
box(9.8,.18,1.25,dark,0,.12,0);
for(let x=-4.2;x<=4.2;x+=1.4){
  box(.12,.8,.12,dark,x,.55,-.5);
  box(.12,.8,.12,dark,x,.55,.5);
}

/* blower */
const blower = cyl(.75,.9,blue,-3.9,1,0);
cyl(.86,.08,metal,-3.35,1,0);
cyl(.86,.08,metal,-4.45,1,0);

const fanGroup = new THREE.Group();
fanGroup.position.set(-3.9,1,0);
scene.add(fanGroup);

for(let i=0;i<8;i++){
  const blade = box(.1,.55,.04,new THREE.MeshStandardMaterial({color:0x7dd3fc,metalness:.45}),0,.23,0);
  blade.rotation.z = i * Math.PI / 4;
  fanGroup.add(blade);
}

/* preheater */
cyl(.62,1.55,glass,-1.75,1,0);
const heaterGlow = cyl(.5,1.35,heaterMat,-1.75,1,0);

for(let i=-.6;i<=.6;i+=.15){
  const coil = new THREE.Mesh(
    new THREE.TorusGeometry(.48,.018,12,80),
    new THREE.MeshBasicMaterial({color:0xff8a00})
  );
  coil.rotation.y = Math.PI / 2;
  coil.position.set(-1.75+i,1,0);
  scene.add(coil);
}

/* combustion chamber */
cyl(.72,2.55,glass,.65,1,0);
cyl(.48,2.3,new THREE.MeshStandardMaterial({
  color:0x475569,
  metalness:.6,
  roughness:.35,
  transparent:true,
  opacity:.42
}),.65,1,0);

for(let x=-.3;x<=1.65;x+=.22){
  for(let a=0;a<Math.PI*2;a+=Math.PI/5){
    sphere(.022,new THREE.MeshBasicMaterial({color:0x0f172a}),x,1+Math.cos(a)*.48,Math.sin(a)*.48);
  }
}

/* flame */
const flame = new THREE.Mesh(new THREE.SphereGeometry(.48,64,32), flameMat);
flame.position.set(.55,1,0);
flame.scale.set(2.1,.45,.45);
scene.add(flame);

/* nozzle */
cone(.55,.18,1.35,metal,2.9,1,0);

/* couplers */
[-2.75,-.85,2.0].forEach(x=>{
  cyl(.82,.12,dark,x,1,0);
  cyl(.9,.035,metal,x-.09,1,0);
  cyl(.9,.035,metal,x+.09,1,0);
});

/* tanks */
cyl(.35,.8,blue,-3.4,.45,-2.15);
cyl(.35,.8,red,-2.35,.45,-2.15);
cyl(.35,.8,yellow,-1.3,.45,-2.15);

/* DAQ */
const daq = box(1.15,.78,.65,dark,1.5,.55,-2.1);
box(.72,.36,.035,new THREE.MeshBasicMaterial({color:0x22c55e}),1.5,.66,-2.45);

/* pipes */
function pipe(points,color){
  const curve = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve,80,.035,14,false);
  const mat = new THREE.MeshStandardMaterial({color,metalness:.3,roughness:.25});
  const mesh = new THREE.Mesh(geo,mat);
  scene.add(mesh);
  return curve;
}

const airCurve = pipe([[-3.4,.9,-2.15],[-3.7,1,-.8],[-3.9,1,0]],0x38bdf8);
const h2Curve = pipe([[-2.35,.9,-2.15],[-1.1,.75,-1.0],[-.25,.95,0]],0xef4444);
const keroCurve = pipe([[-1.3,.9,-2.15],[-.45,.72,-1.0],[.05,.92,0]],0xfacc15);
const exhaustCurve = pipe([[2.9,1,0],[3.8,1,0],[4.8,1,0]],0xe5e7eb);

/* particles */
function makeParticles(count,color){
  const arr = [];
  const mat = new THREE.MeshBasicMaterial({color});
  for(let i=0;i<count;i++){
    const p = sphere(.035,mat,0,0,0);
    p.visible = false;
    arr.push(p);
  }
  return arr;
}

const airParticles = makeParticles(35,0x38bdf8);
const h2Particles = makeParticles(22,0xef4444);
const keroParticles = makeParticles(22,0xfacc15);
const exhaustParticles = makeParticles(35,0xe5e7eb);

function moveParticles(list,curve,active,speed){
  list.forEach((p,i)=>{
    p.visible = active;
    if(!active) return;
    const t = (clock.elapsedTime * speed + i / list.length) % 1;
    p.position.copy(curve.getPoint(t));
  });
}

/* labels */
function label(text,x,y,z){
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 128;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "rgba(2,6,23,.82)";
  ctx.fillRect(0,0,512,128);
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 5;
  ctx.strokeRect(4,4,504,120);
  ctx.fillStyle = "#e0f2fe";
  ctx.font = "bold 38px Arial";
  ctx.textAlign = "center";
  ctx.fillText(text,256,78);

  const tex = new THREE.CanvasTexture(canvas);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  spr.position.set(x,y,z);
  spr.scale.set(1.2,.3,1);
  scene.add(spr);
}

label("BLOWER",-3.9,2,0);
label("PREHEATER",-1.75,2,0);
label("COMBUSTION CHAMBER",.65,2.1,0);
label("NOZZLE",2.9,1.85,0);
label("AIR",-3.4,1.25,-2.15);
label("H₂",-2.35,1.25,-2.15);
label("KEROSENE",-1.3,1.25,-2.15);
label("DAQ",1.5,1.12,-2.1);

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  controls.update();

  if(step >= 1) fanGroup.rotation.x += .26;

  moveParticles(airParticles,airCurve,step>=1,.45);
  moveParticles(h2Particles,h2Curve,step>=3,.5);
  moveParticles(keroParticles,keroCurve,step>=4,.45);
  moveParticles(exhaustParticles,exhaustCurve,step>=6,.55);

  if(step >= 2){
    heaterMat.opacity = .25 + Math.sin(clock.elapsedTime*5)*.12;
  } else {
    heaterMat.opacity = 0;
  }

  if(step >= 5){
    flameMat.opacity = .55 + Math.sin(clock.elapsedTime*18)*.18;
    flame.scale.x = 2.1 + Math.sin(clock.elapsedTime*20)*.18;
    flame.scale.y = .45 + Math.sin(clock.elapsedTime*15)*.06;
    flameLight.intensity = 4 + Math.sin(clock.elapsedTime*18)*1.4;
  } else {
    flameMat.opacity = 0;
    flameLight.intensity = 0;
  }

  renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function updateUI(status,temp,pressure,flow,eff){
  document.getElementById("status").innerText = status;
  document.getElementById("temp").innerText = temp;
  document.getElementById("pressure").innerText = pressure;
  document.getElementById("flow").innerText = flow;
  document.getElementById("eff").innerText = eff;
}

window.nextStep = function(){
  if(step >= 6) return;
  step++;

  if(step === 1) updateUI("BLOWER RUNNING","300 K","1.8 bar","0.22 kg/s","--");
  if(step === 2) updateUI("PREHEATER ACTIVE","650 K","2.1 bar","0.25 kg/s","--");
  if(step === 3) updateUI("HYDROGEN VALVE OPEN","700 K","2.5 bar","0.27 kg/s","--");
  if(step === 4) updateUI("KEROSENE PUMP ACTIVE","760 K","3.2 bar","0.29 kg/s","--");
  if(step === 5) updateUI("IGNITION STARTED","1420 K","4.2 bar","0.31 kg/s","92.8%");
  if(step === 6) updateUI("FULL SYSTEM RUNNING","1480 K","5.0 bar","0.34 kg/s","96.5%");
};

window.autoRun = function(){
  window.shutdown();
  autoTimer = setInterval(()=>{
    window.nextStep();
    if(step >= 6) clearInterval(autoTimer);
  },900);
};

window.shutdown = function(){
  step = 0;
  if(autoTimer) clearInterval(autoTimer);
  updateUI("SYSTEM STANDBY","300 K","0.0 bar","0.00 kg/s","--");
};
</script>

</body>
</html>
